<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=page, initial-scale=1.0">
    <title>Document</title>
    <style>
        #page{
            height: 100vh;
            width: 100%;
            background-color:#433E54 ;
            display:flex;
            align-items: center;
            justify-content: center;
            color:whitesmoke
            font-size:10px;

        }
        #page #container{
            height: 80%;
            width: 90%;
            background:linear-gradient(to right , #6f56c2, rgb(46, 24, 24));
            border-radius: 30px;
            margin-top: 10px;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            
            


        }
        #container #nav{
            display: flex;
            align-items: center;
            justify-content: space-around;
            color: aliceblue;
            font-size: 10px;
            font-family: sans-serif;
        }
        #container #navleft{
            display: flex;
            align-items: center;
            justify-content: space-around;
        }
        #nav #navcenter{
            display: flex;
            gap: 20px;
            align-items: center;

        }
        
        #nav #navright #loginbutton{
            background-color: transparent;
            padding: 5px, 12px;
            border-radius: 50px;
            color: white;
            font-size: 10px;
            border: 2px solid whitesmoke;
        }
        
        
        #nav #navright #Signupbutton{
                        background-color: transparent;
            padding: 5px, 10px;
            border-radius: 50px;
            color: white;
            font-size: 10px;
            border: 2px  solid whitesmoke;

            



        }
    </style>
</head>
<body>
    <div id ="page">
        <div id="container">

            <div id="nav">
                   <div id="navleft">
            <h1>Liquid Brokers</h1>
        </div>
         <div id="navcenter">
            <h1>About</h1>
            <h1>Trading</h1>
            <h1>Contact</h1>
            <h1>FAQ</h1>
            
         </div>
         <div id="navright">
            <button id="loginbutton">
                Login

            </button>
            
            <button id="Signupbutton">
                SignUp
            </button>

         </div>
            </div>

            
        

        </div>
    </div>
    
</body>
</html>
